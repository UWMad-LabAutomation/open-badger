# Packaging metadata for the Open Badger Python package.
# Dependencies are grouped by capability so lightweight development does not
# require installing every training, logging, or deployment dependency.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-badger"
version = "0.1.0"
description = "Research framework for robot policy training and inference"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyarrow>=15.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

training = [
    "torch==2.11.0",
    "torchvision==0.26.0",
]

model = [
    "transformers>=5.4,<5.6",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface-hub[cli]>=0.36",
    "hf-transfer>=0.1.8",
    "pillow>=10",
    "numpy>=1.26,<3",
    "einops>=0.7",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]

data = [
    "boto3>=1.34",
]

lora = [
    "peft>=0.14",
]

logging = [
    "wandb>=0.17",
    "tensorboard>=2.17",
]

[tool.setuptools.packages.find]
where = ["src"]
