# Full-parameter fine-tuning configuration for the generic trainer.
# These are starting values for review, not yet validated MolmoAct2 defaults.

strategy: full_finetune

selection:
  # Train every model component unless the model adapter explicitly marks a
  # component as unsupported or frozen.
  train_all: true
  freeze_unspecified: false

optimizer:
  name: adamw
  learning_rate: 1.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 1000
  min_lr_ratio: 0.0

training:
  max_steps: 50000
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  mixed_precision: null
  seed: 42

checkpointing:
  save_every_steps: 1000
  keep_last_n: 3
  resume_from: null

validation:
  every_steps: 500

logging:
  every_steps: 10
