# Model-agnostic high-level training composition.
# This file selects configs; model-specific settings stay in the referenced files.

model:
  config: ../models/vla/molmoact2.yaml
  strategy: lora

data:
  config: ../data/data_reader.yaml

training:
  logging:
    every_steps: 10
    console: true
    tensorboard:
      enabled: false
      log_dir: null
    wandb:
      enabled: false
      project: open-badger
      entity: null
      run_name: null
      mode: online