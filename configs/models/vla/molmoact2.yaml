model:
  name: molmoact2
  # Fixed limits defined by the released checkpoint. The configured action
  # horizon below must not exceed max_action_horizon.
  max_action_dim: 32
  max_action_horizon: 30
  checkpoint:
    source: huggingface
    repo_id: allenai/MolmoAct2
    revision: null
    force_download: false

runtime:
  device: cuda:0
  requires_grad: true
  backend: torch
  dtype: bfloat16

training:
  # Delegated to the official LeRobot MolmoAct2 policy.
  action_mode: continuous
  train_mode_vlm: lora
  gradient_checkpointing: false
  flow_matching_steps: 8
  flow_matching_cutoff: 1.0
  flow_matching_time_offset: 0.001
  flow_matching_time_scale: 0.999
  flow_matching_beta_alpha: 1.0
  flow_matching_beta_beta: 1.5
  mask_action_dim_padding: true
  enable_knowledge_insulation: false
  freeze_embedding: true
  llm_residual_dropout: 0.1

  lora:
    rank: 64
    alpha: 16
    dropout: 0.05
    bias: none

  optimizer:
    learning_rate: 1.0e-5
    vision_learning_rate: 5.0e-6
    connector_learning_rate: 5.0e-6
    action_expert_learning_rate: 5.0e-5
    betas: [0.9, 0.95]
    eps: 1.0e-6
    weight_decay: 0.0
    grad_clip_norm: 1.0

  scheduler:
    warmup_steps: 200
    decay_steps: null
    decay_learning_rate: 1.0e-6

  normalization:
    visual: identity
    state: quantiles
    action: quantiles

inference:
  action_mode: continuous
  norm_tag: null
  sequence_length: null
  # Number of future control timesteps predicted per policy query.
  action_horizon: 10
  # Number of predicted actions consumed before querying the policy again.
  n_action_steps: 10
  # Internal flow integration steps; this is not the action horizon.
  flow_matching_steps: 8
  num_inference_steps: null
  setup_type: ""
  control_mode: ""
  normalize_language: true
  normalize_gripper: false
  add_setup_tokens: true
  add_control_tokens: true
  max_sequence_length: null
  enable_inference_cuda_graph: false
  per_episode_seed: false
  eval_seed: null
  state_dim: 32
  image_keys: []
  action_dim: 32    # molmoact2 outputs actions and a 32D continuous action space
  history_length: 1

optimization:
  attention: sdpa
  torch_compile: false
  cuda_graphs: false