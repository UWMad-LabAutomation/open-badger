model:
  name: molmoact2
  # Fixed limits defined by the released checkpoint. The configured action
  # horizon below must not exceed max_action_horizon.
  max_action_dim: 32
  max_action_horizon: 30
  checkpoint:
    source: huggingface
    repo_id: allenai/MolmoAct2
    revision: null
    force_download: false

runtime:
  device: cuda:0
  requires_grad: true
  backend: torch
  dtype: bfloat16

training:
  max_steps: 50000
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  seed: 42

  checkpointing:
    save_every_steps: 1000
    keep_last_n: 3
    resume_from: null

  validation:
    every_steps: 500

  logging:
    every_steps: 10

finetuning:
  # The active strategy is selected by the high-level training config.
  # Shared by every fine-tuning strategy.
  action_mode: continuous
  flow_matching_steps: 8
  flow_matching_cutoff: 1.0
  flow_matching_time_offset: 0.001
  flow_matching_time_scale: 0.999
  flow_matching_beta_alpha: 1.0
  flow_matching_beta_beta: 1.5
  mask_action_dim_padding: true
  enable_knowledge_insulation: false
  freeze_embedding: true
  llm_residual_dropout: 0.1

  lora:
    rank: 64
    alpha: 16
    dropout: 0.05
    bias: none

  optimizer:
    learning_rate: 1.0e-5
    vision_learning_rate: 5.0e-6
    connector_learning_rate: 5.0e-6
    action_expert_learning_rate: 5.0e-5
    betas: [0.9, 0.95]
    eps: 1.0e-6
    weight_decay: 0.0
    grad_clip_norm: 1.0

  scheduler:
    warmup_steps: 200
    decay_steps: null
    decay_learning_rate: 1.0e-6

  # Strategies only override behavior that genuinely differs.
  strategies:
    lora:
      train_mode_vlm: lora
      gradient_checkpointing: false

    full_finetune:
      train_mode_vlm: fft
      gradient_checkpointing: true

    action_expert_only:
      train_mode_vlm: freeze
      gradient_checkpointing: false

inference:
  inference_action_mode: continuous
  norm_tag: null
  n_action_steps: 10
  num_inference_steps: null
  add_setup_tokens: true
  add_control_tokens: true
  max_sequence_length: null
  enable_inference_cuda_graph: false
  per_episode_seed: false
  eval_seed: null

optimization:
  attention: sdpa
  torch_compile: false
  cuda_graphs: false