model:
  name: molmoact2
  checkpoint:
    source: huggingface
    repo_id: allenai/MolmoAct2
    revision: null
    cache_dir: null
    local_files_only: false

runtime:
  device: cuda:0
  requires_grad: false
  backend: torch
  dtype: float32

inference:
  action_mode: continuous
  norm_tag: null
  sequence_length: null
  flow_matching_steps: null
  # Ordered observation.images.* keys passed to the MolmoAct2 processor.
  image_keys: []
  n_action_steps: null
  # MolmoAct2 checkpoints expose absolute joint/encoder position targets in
  # this many dims for our robot; predict_action() output is sliced to this.
  action_dim: 32

optimization:
  attention: sdpa
  torch_compile: false
  cuda_graphs: false